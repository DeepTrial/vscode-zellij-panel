name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize lockfile registry for CI
        # The committed lockfile pins tencentyun mirror URLs that are
        # unreachable from GitHub-hosted runners. Rewrite to the public npm
        # registry so install succeeds on CI (harmless on local machines).
        run: sed -i 's#mirrors.tencentyun.com/npm/#registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Type-check (lint)
        run: npm run lint

      - name: Package vsix
        run: npm run package

  test:
    runs-on: ubuntu-latest
    # Extension tests run headless via xvfb. They previously used
    # continue-on-error because of a mocha global-injection issue; that is now
    # fixed (programmatic Mocha runner + explicit activation), so the test job
    # is a real gate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize lockfile registry for CI
        run: sed -i 's#mirrors.tencentyun.com/npm/#registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Run extension tests (headless via xvfb)
        run: xvfb-run -a npm test
