name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Allow the default GITHUB_TOKEN to create GitHub Releases (needs contents: write).
permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize lockfile registry for CI
        run: sed -i 's#mirrors.tencentyun.com/npm/#registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Rebuild native module (node-pty) for the runner platform
        # node-pty ships per-platform prebuilds via optionalDependencies; ensure
        # a usable native binary exists for the CI runner (and thus the vsix).
        run: npm rebuild node-pty

      - name: Compile
        run: npm run compile

      - name: Package vsix
        run: npm run package

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-zellij-panel
          path: '*.vsix'

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
